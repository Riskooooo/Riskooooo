
<svg width="500" height="180" xmlns="http://www.w3.org/2000/svg">

<style>
.title {
font: bold 18px Arial;
fill: white;
}

.text {
font: 14px Arial;
fill: #b3b3b3;
}

.status {
font: bold 12px Arial;
fill: #1DB954;
}

.bar {
animation: move 1s infinite;
}

@keyframes move {
0% { height: 10px; }
50% { height: 30px; }
100% { height: 10px; }
}
</style>


